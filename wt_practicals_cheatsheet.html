
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--text2:#8b949e;--accent:#58a6ff;--copy:#238636;--copy-h:#2ea043;--copied:#1f6feb;--code-bg:#010409}
.light{--bg:#ffffff;--surface:#f6f8fa;--border:#d0d7de;--text:#24292f;--text2:#57606a;--accent:#0969da;--copy:#1a7f37;--copy-h:#2da44e;--copied:#0969da;--code-bg:#161b22}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;padding:16px;transition:background .2s,color .2s}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--border)}
.topbar h1{font-size:22px;font-weight:600;color:var(--text)}
.tbtn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .2s}
.tbtn:hover{background:var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card-hdr{display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600;color:var(--text)}
.cbtn{background:var(--copy);border:none;color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:background .2s;white-space:nowrap}
.cbtn:hover{background:var(--copy-h)}
.cbtn.ok{background:var(--copied)}
.code-wrap{overflow:auto;background:var(--code-bg);border-radius:6px;padding:10px;max-height:260px}
.code-wrap::-webkit-scrollbar{width:4px;height:4px}
.code-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
pre{font-family:'Consolas','Courier New',monospace;font-size:11.5px;line-height:1.6;color:#c9d1d9;white-space:pre}
.kw{color:#ff7b72;font-weight:600}.ty{color:#ffa657}.st{color:#a5d6ff}.cm{color:#8b949e}.nm{color:#79c0ff}.tg{color:#7ee787}.ph{color:#d2a8ff}
</style>

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function highlight(code){
  let s=esc(code);
  const saved=[];
  const stash=m=>{saved.push(m);return'\x00'+(saved.length-1)+'\x00'};
  s=s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g,m=>stash('<span class="cm">'+m+'</span>'));
  s=s.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,m=>stash('<span class="st">'+m+'</span>'));
  s=s.replace(/(&lt;\?php|&lt;\?|\?&gt;)/g,m=>stash('<span class="ph">'+m+'</span>'));
  s=s.replace(/(&lt;\/?[a-zA-Z][a-zA-Z0-9-]*)/g,m=>stash('<span class="tg">'+m+'</span>'));
  s=s.replace(/\b(function|var|let|const|if|else|return|switch|case|break|default|while|for|foreach|class|new|this|typeof|null|true|false|undefined|echo|print|isset|empty|array|include|require|date_default_timezone_set|date|strrev|strlen|substr|print_r|number_format|array_push|in_array|array_keys|array_merge|implode|sort|count|parseFloat|prompt|alert|document|getElementById|createElement|appendChild|textContent|toLocaleTimeString)\b/g,m=>stash('<span class="kw">'+m+'</span>'));
  s=s.replace(/\b(\d+\.?\d*)\b/g,m=>stash('<span class="nm">'+m+'</span>'));
  return s.replace(/\x00(\d+)\x00/g,(_,i)=>saved[+i]);
}

const grid=document.getElementById('grid');
programs.forEach(p=>{
  const card=document.createElement('div');card.className='card';
  const hdr=document.createElement('div');hdr.className='card-hdr';
  const title=document.createElement('div');title.className='card-title';title.textContent=p.title;
  const btn=document.createElement('button');btn.className='cbtn';btn.textContent='Copy';
  btn.onclick=()=>{
    navigator.clipboard.writeText(p.code).then(()=>{
      btn.textContent='Copied!';btn.classList.add('ok');
      setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok')},1200);
    });
  };
  hdr.append(title,btn);
  const wrap=document.createElement('div');wrap.className='code-wrap';
  wrap.innerHTML='<pre>'+highlight(p.code)+'</pre>';
  card.append(hdr,wrap);
  grid.appendChild(card);
});

function toggleTheme(){
  document.body.classList.toggle('light');
  document.getElementById('themeBtn').textContent=
    document.body.classList.contains('light')?'Dark Mode':'Light Mode';
}
